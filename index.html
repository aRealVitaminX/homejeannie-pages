<!doctype html>
  <html lang="de">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Jeannie</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <style>
    :root{
      --bg-top:#241a44; --bg-mid:#170f30; --bg-bot:#0f0a22;
    --ink:#f4f2fa; --ink-dim:rgba(244,242,250,.62);
          --gold-1:#ffd479; --gold-2:#ff9d47;
          --glass:rgba(255,255,255,.06); --glass-b:rgba(255,255,255,.13);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
  *{box-sizing:border-box}
  body{
        margin:0; min-height:100vh; font-family:var(--font); color:var(--ink);
    background:linear-gradient(180deg,var(--bg-top),var(--bg-mid) 55%,var(--bg-bot));
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ max-width:420px; width:100%; text-align:center; }
  .icon{ font-size:56px; margin-bottom:8px; }
  h1{ font-size:26px; margin:0 0 6px; font-weight:800; }
  p.tag{ color:var(--ink-dim); margin:0 0 32px; font-size:14.5px; }
  .links{ display:flex; flex-direction:column; gap:12px; }
  a.btn{
    display:block; padding:16px 20px; border-radius:16px; text-decoration:none;
    background:var(--glass); border:1px solid var(--glass-b); color:var(--ink);
    font-weight:700; font-size:15px; transition:background .15s;
  }
  a.btn:hover{ background:rgba(255,255,255,.1); }
  footer{ margin-top:40px; font-size:12px; color:rgba(244,242,250,.4); }
</style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🏠</div>
      <h1>Home Jeannie</h1>
      <p class="tag">Gemeinsam schaffen. Spielerisch belohnt.</p>
      <div class="links">
        <a class="btn" href="support.html">💬 Support &amp; FAQ</a>
        <a class="btn" href="privacy.html">🔒 Datenschutzerklärung</a>
      </div>
      <footer>© 2026 Patrick Milata</footer>
    </div>
  </body>
  </html>
